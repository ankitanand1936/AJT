# ---------- Server ----------
server.port=8080

# ---------- MySQL (database: learnforge) ----------
# createDatabaseIfNotExist=true lets MySQL create the schema on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/learnforge
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Hibernate / JPA ----------
# "update" creates the 7 tables from the entities if they do not exist yet
# (you can also create them manually with sql/learnforge.sql).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Error page ----------
# Use our own JSP error page (error.jsp) instead of the default whitelabel page.
server.error.whitelabel.enabled=false

# ---------- JSP views ----------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
